<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DahabPlus - Codsiga Deynamada</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: #f7f4ee;
            overflow: hidden;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        
        header {
            width: 100%;
            max-width: 480px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: white;
            box-shadow: 0 2px 10px rgba(20, 33, 61, 0.1);
        }
        
        .back-btn {
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
            color: #14213D;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo img {
            height: 36px;
            width: auto;
            object-fit: contain;
        }
        
        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: #F5A623;
            background: #14213D;
            padding: 4px 14px;
            border-radius: 8px;
        }
        
        .card {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 40px rgba(20, 33, 61, 0.12);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .form-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: #14213D;
        }
        
        .progress-bar {
            width: 180px;
            height: 6px;
            background: #f0e2c8;
            border-radius: 3px;
            margin: 30px auto;
            overflow: hidden;
        }
        
        .progress-fill {
            width: 33.33%;
            height: 100%;
            background: linear-gradient(to right, #F5A623, #D97706);
        }
        
        .step-text {
            text-align: center;
            color: #777;
            font-size: 15px;
            margin-bottom: 30px;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            color: #14213D;
            margin-bottom: 8px;
            font-size: 15px;
        }
        
        .form-select,
        .form-input,
        .form-textarea {
            width: 100%;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 24px;
            transition: border 0.3s;
        }
        
        .form-select:focus,
        .form-input:focus,
        .form-textarea:focus {
            border-color: #F5A623;
            outline: none;
        }
        
        .invalid {
            border-color: #e74c3c !important;
        }
        
        .next-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(to right, #F5A623, #D97706);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: auto;
        }
        
        footer {
            padding: 20px;
            color: #a09a8e;
            font-size: 13px;
            text-align: center;
            margin-top: auto;
        }
    </style>
</head>

<body>
    <header>
        <button class="back-btn" onclick="history.back()">←</button>
        <div class="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnW8BYxCgA8Utr7AsAzBJ_Rnu_PRQ0SqxFeUTS5PX9oQ&s=10" alt="DahabPlus"> </div>
        <div></div>
    </header>
    <main class="card">
        <h1 class="form-title">Codsiga Deynamada</h1>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <div class="step-text">Tallaabada 1 ee 3</div>

        <label class="form-label">Nooca Deynamada</label>
        <select class="form-select" id="loanType">
            <option>Deyn Shakhsi ah</option>
            <option>Deyn Ganacsi</option>
            <option>Deyn Guri</option>
            <option>Deyn Gaari</option>
            <option>Deyn Waxbarasho</option>
        </select>

        <label class="form-label">Qaddarka Deynamada (Sh)</label>
        <input type="number" class="form-input" id="loanAmount" placeholder="500000" min="5000" max="500000" step="5000">

        <label class="form-label">Muddada Deynamada</label>
        <select class="form-select" id="loanTerm">
            <option>6 Bilood</option>
            <option>12 Bilood</option>
            <option>18 Bilood</option>
            <option>24 Bilood</option>
            <option>36 Bilood</option>
            <option>48 Bilood</option>
            <option>60 Bilood</option>
        </select>

        <label class="form-label">Ujeeddada Deynamada</label>
        <textarea class="form-textarea" id="loanPurpose" placeholder="Maxaad ku isticmaali doontaa deynamada?"></textarea>

        <button class="next-btn" id="nextBtn">TALLAABADA XIGTA</button>
    </main>
    <footer>© 2026 DahabPlus</footer>

    <script>
        // Pre-fill
        if (localStorage.getItem('loanAmount')) document.getElementById('loanAmount').value = localStorage.getItem('loanAmount');
        if (localStorage.getItem('loanTerm')) document.getElementById('loanTerm').value = localStorage.getItem('loanTerm') + ' Bilood';

        document.getElementById('nextBtn').addEventListener('click', function() {
            const amount = document.getElementById('loanAmount').value.trim();
            const purpose = document.getElementById('loanPurpose').value.trim();

            let valid = true;
            document.querySelectorAll('.form-input, .form-textarea').forEach(el => el.classList.remove('invalid'));

            if (!amount || amount < 5000) {
                document.getElementById('loanAmount').classList.add('invalid');
                valid = false;
            }
            if (!purpose) {
                document.getElementById('loanPurpose').classList.add('invalid');
                valid = false;
            }

            if (!valid) {
                alert('Fadlan buuxi dhammaan meelaha loo baahan yahay.');
                return;
            }

            localStorage.setItem('loanType', document.getElementById('loanType').value);
            localStorage.setItem('loanAmount', amount);
            localStorage.setItem('loanTerm', document.getElementById('loanTerm').value.replace(' Bilood', ''));
            localStorage.setItem('loanPurpose', purpose || 'Lama cayimn');

            window.location.href = 'details.html';
        });
    </script>
</body>

</html>
