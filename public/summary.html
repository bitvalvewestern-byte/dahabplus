<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DahabPlus - Codsiga Deynamada</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: #f7f4ee;
            overflow: hidden;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        
        header {
            width: 100%;
            max-width: 480px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: white;
            box-shadow: 0 2px 10px rgba(20, 33, 61, 0.1);
        }
        
        .back-btn {
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
            color: #14213D;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border-radius: 12px;
            background: #fff;
        }
        
        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: #F5A623;
            background: #14213D;
            padding: 4px 14px;
            border-radius: 8px;
            line-height: 1.1;
        }
        
        .card {
            background: white;
            border-radius: 24px;
            padding: 30px 25px;
            width: 100%;
            max-width: 480px;
            height: calc(100vh - 100px);
            box-shadow: 0 15px 40px rgba(20, 33, 61, 0.12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .top {
            text-align: center;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }
        
        .form-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #14213D;
        }
        
        .progress-bar {
            width: 160px;
            height: 6px;
            background: #f0e2c8;
            border-radius: 3px;
            margin: 20px auto;
            overflow: hidden;
        }
        
        .progress-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #F5A623, #D97706);
        }
        
        .step-text {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: #14213D;
            margin-bottom: 8px;
            font-size: 15px;
        }
        
        .form-select,
        .form-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 16px;
        }
        
        .form-select:focus,
        .form-input:focus {
            border-color: #F5A623;
            outline: none;
        }
        
        .summary-box {
            background: #FFF8EC;
            padding: 16px;
            border-radius: 16px;
            font-size: 14px;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #555;
        }
        
        .summary-value {
            font-weight: 600;
            color: #14213D;
        }
        
        .btn-group {
            display: flex;
            gap: 12px;
        }
        
        .prev-btn,
        .submit-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .prev-btn {
            background: #eee;
            color: #666;
        }
        
        .submit-btn {
            background: linear-gradient(to right, #F5A623, #D97706);
            color: white;
            position: relative;
        }
        
        footer {
            padding: 20px;
            color: #a09a8e;
            font-size: 13px;
            text-align: center;
            width: 100%;
            max-width: 480px;
        }
        
        #spinnerOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(217, 119, 6, 0.15);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #f0e2c8;
            border-top: 6px solid #F5A623;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }
        
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        #successOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 33, 61, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .success-card {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }
        
        .check-icon {
            width: 80px;
            height: 80px;
            background: #F5A623;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            font-size: 48px;
            color: white;
        }
        
        .success-title {
            font-size: 24px;
            font-weight: 700;
            color: #D97706;
            margin-bottom: 15px;
        }
        
        .success-msg {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .redirect-bar {
            background: #f0f0f0;
            padding: 14px;
            border-radius: 50px;
            font-size: 15px;
            color: #666;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .redirect-bar .loader {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #F5A623;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .go-login-btn {
            width: 100%;
            padding: 16px;
            background: #14213D;
            color: #F5A623;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <button class="back-btn" onclick="history.back()">←</button>

        <div class="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnW8BYxCgA8Utr7AsAzBJ_Rnu_PRQ0SqxFeUTS5PX9oQ&s=10" alt="DahabPlus">
            <div class="logo-text">DahabPlus</div>
        </div>

        <div></div>
    </header>

    <main class="card">
        <div class="top">
            <h1 class="form-title">Dib-u-eegis Final ah</h1>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <div class="step-text">Tallaabada 3 ee 3</div>

            <label class="form-label">Xaaladda Shaqada</label>
            <select class="form-select" id="employmentStatus">
                <option>Shaqaystay</option>
                <option>Is shaqeysata</option>
                <option>Danab la'aan</option>
                <option>Arday</option>
            </select>

            <label class="form-label">Dakhlinka Sannadlaha (Sh)</label>
            <input type="number" class="form-input" id="annualIncome" placeholder="500000">

            <div class="summary-box" id="summaryBox">
                <!-- Filled dynamically by JavaScript -->
            </div>
        </div>

        <div class="btn-group">
            <button class="prev-btn" onclick="history.back()">Gadbay</button>
            <button class="submit-btn" id="submitBtn">Gudbi Codsiga</button>
        </div>
    </main>

    <footer>© 2026 DahabPlus</footer>

    <div id="spinnerOverlay">
        <div class="spinner"></div>
    </div>

    <div id="successOverlay">
        <div class="success-card">
            <div class="check-icon">✓</div>
            <div class="success-title">Codsiga Waa La Gudbiyay</div>
            <div class="success-msg">
                Codsigaaga waa la gudbiyay. Fadlan sug oggolaanshaha.<br><br> Fariin xaqiijin ah ayaa lagu siin doonaa. Hadda, sii wad DahabPlus.
            </div>
            <div class="redirect-bar">
                <div class="loader"></div>
                La gelgelinayo login-ka DahabPlus gudaha <span id="countdown">3</span>...
            </div>
            <button class="go-login-btn" onclick="window.location.href='login.html'">U Gudub Login-ka Hadda</button>
        </div>
    </div>

    <script>
        const summaryBox = document.getElementById('summaryBox');

        // Somali currency: Somali Shilling (Sh)
        const shAmount = parseFloat(localStorage.getItem('loanAmount') || 5000);
        const loanAmountFormatted = shAmount.toLocaleString('en-US') + ' Sh';

        summaryBox.innerHTML = `
            <div class="summary-row"><span>Nooca Deynamada:</span><span class="summary-value">${localStorage.getItem('loanType') || 'Deyn Shakhsi ah'}</span></div>
            <div class="summary-row"><span>Qaddarka:</span><span class="summary-value">${loanAmountFormatted}</span></div>
            <div class="summary-row"><span>Muddada:</span><span class="summary-value">${localStorage.getItem('loanTerm') || '12'} Bilood</span></div>
            <div class="summary-row"><span>Ujeeddada:</span><span class="summary-value">${localStorage.getItem('loanPurpose') || 'Lama cayimn'}</span></div>
            <div class="summary-row"><span>Magaca:</span><span class="summary-value">${localStorage.getItem('firstName') || ''} ${localStorage.getItem('lastName') || ''}</span></div>
            <div class="summary-row"><span>Email:</span><span class="summary-value">${localStorage.getItem('email') || 'Lama siin'}</span></div>
            <div class="summary-row"><span>Taleefan:</span><span class="summary-value">${localStorage.getItem('phone') || 'Lama siin'}</span></div>
        `;

        if (localStorage.getItem('employmentStatus')) {
            document.getElementById('employmentStatus').value = localStorage.getItem('employmentStatus');
        }

        if (localStorage.getItem('annualIncome')) {
            document.getElementById('annualIncome').value = localStorage.getItem('annualIncome');
        }

        document.getElementById('submitBtn').addEventListener('click', function() {
            const income = document.getElementById('annualIncome').value.trim();

            // Minimum set for Shilin
            if (!income || income < 1000) {
                alert('Fadlan geli dakhli sannadle sax ah (ugu yaraan 1,000 Sh).');
                return;
            }

            localStorage.setItem('employmentStatus', document.getElementById('employmentStatus').value);
            localStorage.setItem('annualIncome', income);

            const spinnerOverlay = document.getElementById('spinnerOverlay');
            spinnerOverlay.style.display = 'flex';

            setTimeout(() => {
                spinnerOverlay.style.display = 'none';

                const successOverlay = document.getElementById('successOverlay');
                successOverlay.style.display = 'flex';

                let seconds = 3;
                const countdownEl = document.getElementById('countdown');
                const timer = setInterval(() => {
                    seconds--;
                    countdownEl.textContent = seconds;
                    if (seconds <= 0) {
                        clearInterval(timer);
                        window.location.href = 'login.html';
                    }
                }, 1000);
            }, 3000);
        });
    </script>
</body>

</html>
